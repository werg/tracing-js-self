name: External JS/TS corpus acquisition (non-admitted)
on:
  push:
    branches: [main]
    paths:
      - 'src/corpus/import-external.mjs'
      - 'src/corpus/full-disposition.mjs'
      - 'src/corpus/original-sites.mjs'
      - 'tools/convert-full-corpus.mjs'
      - 'tools/verify-exercism-owned.mjs'
      - 'tools/import-external-corpus.mjs'
      - 'corpus/extension/**'
      - 'test/external-*.test.js'
      - '.github/workflows/external-corpus.yml'
  pull_request:
    paths:
      - 'src/corpus/import-external.mjs'
      - 'src/corpus/full-disposition.mjs'
      - 'src/corpus/original-sites.mjs'
      - 'tools/convert-full-corpus.mjs'
      - 'tools/verify-exercism-owned.mjs'
      - 'tools/import-external-corpus.mjs'
      - 'corpus/extension/**'
      - 'test/external-*.test.js'
      - '.github/workflows/external-corpus.yml'
  workflow_dispatch:
    inputs:
      full_sources:
        description: 'Also acquire complete pinned Test262, Exercism and JSON Schema checkouts'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  snapshot-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Independently check snapshot integrity and acquisition contracts
        run: node --test test/external-corpus.test.js test/external-snapshots.test.js
      - name: Catalog exact committed snapshots (acquisition only)
        run: |
          mkdir -p corpus/out
          node tools/import-external-corpus.mjs \
            --format test262 --root corpus/extension/snapshots/test262 \
            --repository tc39/test262 --license BSD-3-Clause \
            --revision d53ebc8b1931d9f1541e43d59650776e4b766248 \
            --snapshot --lock corpus/extension/snapshots/test262/snapshot.lock.json \
            --output corpus/out/test262-snapshot.jsonl --report corpus/out/test262-snapshot.json
          node tools/import-external-corpus.mjs \
            --format exercism --root corpus/extension/snapshots/exercism \
            --repository exercism/problem-specifications --license MIT \
            --revision 650bebeb39ad40439175288042aece982b0a90a9 \
            --snapshot --lock corpus/extension/snapshots/exercism/snapshot.lock.json \
            --output corpus/out/exercism-snapshot.jsonl --report corpus/out/exercism-snapshot.json
          node tools/import-external-corpus.mjs \
            --format json-schema --root corpus/extension/snapshots/json-schema \
            --repository json-schema-org/JSON-Schema-Test-Suite --license MIT \
            --revision 89e83a74014617ffbe79a56d83d14d054cd11417 \
            --snapshot --lock corpus/extension/snapshots/json-schema/snapshot.lock.json \
            --output corpus/out/json-schema-snapshot.jsonl --report corpus/out/json-schema-snapshot.json
          node -e 'const fs=require("fs");for(const n of ["test262","exercism","json-schema"]){const x=JSON.parse(fs.readFileSync("corpus/out/"+n+"-snapshot.json"));if(x.records<1||x.admitted!==0||x.verified!==0)process.exitCode=1;console.log(n,x.records,"fixture candidates",x.programs,"program families",x.sourceFiles,"source files");}'
      - name: Upload candidate fixtures and reports (not executed or admitted)
        uses: actions/upload-artifact@v4
        with:
          name: locked-external-acquisition-only
          path: |
            corpus/out/*-snapshot.json
            corpus/out/*-snapshot.jsonl
          if-no-files-found: error

  full-acquisition:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_sources) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Fetch and pin full public source checkouts (do not execute guest code)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          pin() {
            local repo="$1" sha="$2" dir="$3"
            git init -q "$RUNNER_TEMP/upstream/$dir"
            git -C "$RUNNER_TEMP/upstream/$dir" remote add origin "https://github.com/$repo.git"
            git -C "$RUNNER_TEMP/upstream/$dir" fetch -q --depth=1 origin "$sha"
            git -C "$RUNNER_TEMP/upstream/$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/upstream/$dir" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$RUNNER_TEMP/upstream/$dir" status --porcelain --untracked-files=no)"
          }
          pin tc39/test262 d53ebc8b1931d9f1541e43d59650776e4b766248 test262
          pin exercism/problem-specifications 650bebeb39ad40439175288042aece982b0a90a9 exercism
          pin json-schema-org/JSON-Schema-Test-Suite 89e83a74014617ffbe79a56d83d14d054cd11417 json-schema
      - name: Acquire every recognized pinned source/input fixture without execution
        run: |
          set -euo pipefail
          mkdir -p corpus/out/full
          node tools/import-external-corpus.mjs \
            --format test262 --root "$RUNNER_TEMP/upstream/test262" \
            --repository tc39/test262 --license BSD-3-Clause \
            --revision d53ebc8b1931d9f1541e43d59650776e4b766248 \
            --output corpus/out/full/test262.jsonl --report corpus/out/full/test262.json
          node tools/import-external-corpus.mjs \
            --format exercism --root "$RUNNER_TEMP/upstream/exercism" \
            --repository exercism/problem-specifications --license MIT \
            --revision 650bebeb39ad40439175288042aece982b0a90a9 \
            --output corpus/out/full/exercism.jsonl --report corpus/out/full/exercism.json
          node tools/import-external-corpus.mjs \
            --format json-schema --root "$RUNNER_TEMP/upstream/json-schema" \
            --repository json-schema-org/JSON-Schema-Test-Suite --license MIT \
            --revision 89e83a74014617ffbe79a56d83d14d054cd11417 \
            --output corpus/out/full/json-schema.jsonl --report corpus/out/full/json-schema.json
          node -e 'const fs=require("fs");for(const n of ["test262","exercism","json-schema"]){const x=JSON.parse(fs.readFileSync("corpus/out/full/"+n+".json"));if(!x.records||x.admitted!==0||x.verified!==0||x.truncated)process.exitCode=1;console.log(n,x.records,"acquired candidate fixtures",x.sourceFiles,"original source files");}'
      - name: Independently check curated original-JS proof execution and original-site receipts
        run: |
          node tools/verify-exercism-owned.mjs \
            --per-family 12 --mutations-per-family 8 --max-cases 420 \
            --min-owned 71 \
            --output corpus/out/full/exercism-owned-report.json \
            --review corpus/out/full/exercism-owned-review.md \
            --local-episodes corpus/out/full/exercism-owned-local.jsonl
      - name: One-for-one full inventory conversion disposition (no fabricated traces)
        run: |
          node tools/convert-full-corpus.mjs \
            --test262 corpus/out/full/test262.jsonl \
            --exercism corpus/out/full/exercism.jsonl \
            --json-schema corpus/out/full/json-schema.jsonl \
            --owned-report corpus/out/full/exercism-owned-report.json \
            --min-inventory 117773 \
            --output corpus/out/full/disposition.jsonl \
            --report corpus/out/full/disposition-report.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("corpus/out/full/disposition-report.json"));
            if(r.status!=="complete-accounting"||r.readCount!==117773||
              r.locallyVerified<34||r.readCount!==r.locallyVerified+r.refused||
              r.admitted!==0||r.allConverted===true)throw Error("False full conversion evidence "+JSON.stringify(r));
            console.log("Acquired records dispositioned",r.readCount,
              "owned locally verified",r.locallyVerified,
              "explicit refusal",r.refused,"admitted",r.admitted);
          '
      - name: Upload full acquired catalogs (not verified semantic traces)
        uses: actions/upload-artifact@v4
        with:
          name: full-pinned-source-catalog-only
          path: |
            corpus/out/full/*.jsonl
            corpus/out/full/*.json
            corpus/out/full/*.md
          if-no-files-found: error
