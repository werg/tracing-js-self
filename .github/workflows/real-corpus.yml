name: Pinned real-world JS and TS trace corpus

on:
  push:
    branches: [main]
    paths:
      - 'src/observational.js'
      - 'src/runtime.js'
      - 'src/spec-operations.js'
      - 'src/frontend.js'
      - 'src/training/**'
      - 'catalog/operations.json'
      - 'corpus/**'
      - 'tools/build-real-corpus.mjs'
      - 'tools/audit-owned-coverage.mjs'
      - 'tools/merge-owned-coverage.mjs'
      - 'tools/audit-stateful-corpus.mjs'
      - 'tools/audit-real-corpus.mjs'
      - '.github/workflows/real-corpus.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'corpus/**'
      - 'tools/build-real-corpus.mjs'
      - 'tools/audit-owned-coverage.mjs'
      - 'test/corpus-owned-episodes.test.js'
      - 'test/corpus-exhaustive-audits.test.js'
      - '.github/workflows/real-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-real-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate real-source V8 observation corpus and readable review
        run: |
          npm run corpus:generate -- \
            --per-function 12 --max-events 2400 \
            --output corpus/out/traces.jsonl \
            --report corpus/out/report.json \
            --review corpus/out/review.md
      - name: Audit understanding, noise, effects and source coverage
        run: |
          npm run corpus:audit --             --input corpus/out/traces.jsonl             --output corpus/out/quality.json             --review corpus/out/quality.md             --examples 30
      - name: Compare with independently verified owned interpreter
        run: |
          npm run corpus:owned-coverage --             --input corpus/out/traces.jsonl             --output corpus/out/owned-coverage.json             --per-function 2             --local-episodes corpus/out/owned-locally-verified.jsonl             --min-owned-verified 114
      - name: Validate provenance and explicit diagnostic status
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync("corpus/out/report.json"));
            if(report.schema!=="real-source-corpus-report/1" ||
                report.mode!=="diagnostic-only" ||
                report.totals.functions<70 ||
                report.totals.requested<800 ||
                !report.sources.vscode.revision ||
                !report.sources.lodash.revision)
              process.exit(1);
            console.log("Verified observations:",report.acceptedExamples,
              "distinct original functions:",report.acceptedFunctions);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-real-world-js-ts-observations
          path: corpus/out/
          retention-days: 14

  verify-entire-owned-corpus:
    needs: observe-real-code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        start: [0, 2, 4, 6, 8, 10]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: pinned-real-world-js-ts-observations
          path: corpus/out/
      - name: Verify every input in this complete source partition
        shell: bash
        run: |
          start=${{ matrix.start }}
          end=$((start + 2))
          mkdir -p corpus/full
          npm run corpus:owned-coverage -- \
            --input corpus/out/traces.jsonl --per-function 12 \
            --index-start "$start" --index-end "$end" --require-complete \
            --output "corpus/full/owned-$start.json" \
            --local-episodes "corpus/full/owned-$start-local.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: owned-real-source-${{ matrix.start }}
          path: corpus/full/
          retention-days: 14
          if-no-files-found: error

  audit-entire-owned-corpus:
    needs: verify-entire-owned-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: owned-real-source-*
          path: corpus/full/
          merge-multiple: true
      - name: Require 936 complete owned checks and classify all refusals
        run: |
          npm run corpus:owned-merge -- \
            --require-complete --min-owned-verified 684 \
            --output corpus/full/owned-all-summary.json \
            --review corpus/full/owned-all-review.md \
            corpus/full/owned-{0,2,4,6,8,10}.json
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-complete-owned-corpus-evidence
          path: |
            corpus/full/owned-all-summary.json
            corpus/full/owned-all-review.md
          retention-days: 14
          if-no-files-found: error
