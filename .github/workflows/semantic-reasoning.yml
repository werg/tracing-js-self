name: Inspect source-grounded semantic traces

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  workflow_dispatch:
jobs:
  semantic-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check source expression grounding, admission and compaction
        run: node --test test/training-semantic-source.test.js test/training-semantic-projection.test.js test/training-model-context-v4.test.js
      - name: Certify strict assignment, intermediate execution and abstraction gates
        run: |
          node --test \
            test/strict-accessor-assignment.test.js \
            test/training-completion-reference.test.js \
            test/semantic-local-state-compaction.test.js \
            test/semantic-trace-gallery.test.js \
            test/semantic-summary-experiment.test.js \
            test/training-causal-lm-bridge.test.js \
            test/native-prepared-coverage.test.js \
            test/source-split-stress.test.js \
            test/aggregate-runner.test.js \
            test/generation-shards.test.js
      - name: Retain independent teacher-mutation receipt
        run: |
          node tools/audit-teacher-mutations.mjs --out "$RUNNER_TEMP/teacher-mutations.json" > "$RUNNER_TEMP/teacher-mutations.stdout.json"
          node -e "const fs=require('node:fs');const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/teacher-mutations.json'));if(!a.passed||a.detectedIndependently!==a.attempted)process.exit(1);console.log(a.detectedIndependently+'/'+a.attempted+' independent teacher mutants caught')"
      - name: Check learning-diagnostic and convergence accounting
        run: |
          python3 test/test_learning_diagnostics.py
          python3 test/test_convergence_ladder.py
      - name: Retain bounded teacher evidence even on a failing gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-teacher-mutation-audit
          path: |
            ${{ runner.temp }}/teacher-mutations.json
            ${{ runner.temp }}/teacher-mutations.stdout.json
          if-no-files-found: ignore
      - name: Generate readable source-certified traces with effects and callbacks
        if: always()
        run: node tools/inspect-semantic-reasoning.mjs
