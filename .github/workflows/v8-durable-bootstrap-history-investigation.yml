name: Durable child bootstrap and complete host-history recovery

on:
  push:
    branches: [codex/v8-bootstrap-causal-unified-20261122]

permissions:
  contents: read

concurrency:
  group: durable-bootstrap-history-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  paired-bootstrap-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MEGATOKEN_ROOT: ${{ github.workspace }}/megatoken
      MEGATOKEN_PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/megatoken/src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      REQUIRE_KNOWN_COMMIT_RECOVERY: '1'
      REQUIRE_DURABLE_BOOTSTRAP_RECOVERY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5d53e47b39ccc1699db6da0c6f53bb703b3dce2
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: werg/megatoken
          ref: 56cce3b80423b0cb70c3a096d867561066e3a211
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: tracing-js-self/.nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install locked paired runtime and require genuine kernel authority
        run: |
          test -L /proc/self/ns/time
          npm ci --prefix tracing-js-self --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tracing-js-self/tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
          test "$(git -C tracing-js-self rev-parse HEAD)" = e5d53e47b39ccc1699db6da0c6f53bb703b3dce2
          test "$(git -C megatoken rev-parse HEAD)" = 56cce3b80423b0cb70c3a096d867561066e3a211
          cmp tracing-js-self/contracts/semantic-execution-v8.json megatoken/src/megatoken/data/contracts/semantic-execution-v8.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          data={'workflowRevision':os.environ['GITHUB_SHA'],'requiredNativeCases':151,'requiredProducerCases':170}
          for repo in ('tracing-js-self','megatoken'):
              data[repo]={key:subprocess.check_output(['git','-C',repo,'rev-parse',value],text=True).strip()
                  for key,value in [('revision','HEAD'),('tree','HEAD^{tree}')]}
          (Path(os.environ['RUNNER_TEMP'])/'bootstrap-source-identities.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          PY
      - name: Verify unified native bootstrap, close, router and launch controls
        working-directory: megatoken
        run: |
          python -m pytest -q tests/test_semantic_commit_recovery_v8.py tests/test_semantic_request_journal_v8.py \
            tests/test_semantic_bootstrap_recovery_v8.py tests/test_semantic_close_recovery_v8.py \
            tests/test_semantic_launch_v8.py tests/test_semantic_v8_position_receipts.py \
            --junitxml="$RUNNER_TEMP/native-bootstrap.xml"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'native-bootstrap.xml').getroot().iter('testcase'))
          if len(cases)!=151 or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('All 151 exact native bootstrap/close/journal/commit/router/launch controls must run and pass')
          print('151 actual native bootstrap, close, journal, commit, router and launch controls passed; zero skips')
          PY
      - name: Verify complete host history, actual native recovery and crash boundaries
        working-directory: tracing-js-self
        run: |
          node --experimental-vm-modules --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/host-bootstrap-history.xml" \
            test/native-request-journal-v8.test.js \
            test/selected-orchestration-clock.test.js \
            test/semantic-known-commit-builder-v8.test.js \
            test/semantic-known-bootstrap-builder-v8.test.js \
            test/semantic-known-commit-history-v8.test.js \
            test/semantic-known-bootstrap-history-v8.test.js \
            test/semantic-native-durable-commit-v8.test.js \
            test/semantic-native-durable-bootstrap-v8.test.js \
            test/semantic-native-orchestration-recovery-v8.test.js \
            test/semantic-selected-orchestration-checkpoint-v8.test.js \
            test/semantic-selected-history-tail-v8.test.js \
            test/semantic-selected-orchestration-v8.test.js \
            test/semantic-selected-history-v8.test.js \
            test/semantic-selected-history-automatic-v8.test.js \
            2>&1 | tee "$RUNNER_TEMP/host-bootstrap-history.log"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'host-bootstrap-history.xml').getroot().iter('testcase'))
          if len(cases)!=170 or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every one of the 170 exact bootstrap/journal/clock/whole-history controls must run and pass')
          print('170 host bootstrap, request-journal, kernel-clock, native durability and complete-history controls passed; zero skips')
          PY
      - name: Preserve exact candidate checkouts
        if: ${{ !cancelled() }}
        run: |
          test -z "$(git -C tracing-js-self status --porcelain)"
          test -z "$(git -C megatoken status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-bootstrap-history-controls
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-bootstrap.xml
            ${{ runner.temp }}/host-bootstrap-history.xml
            ${{ runner.temp }}/host-bootstrap-history.log
            ${{ runner.temp }}/bootstrap-source-identities.json
