name: Source-owned module scheduler lifecycle and native parity

on:
  push:
    branches: [codex/v8-module-scheduler-state-20261122, codex/v8-scheduler-source-ownership-20261122, codex/v8-nested-async-calls-20261122, codex/v8-bound-module-ledger-20261122]

permissions:
  contents: read

concurrency:
  group: module-scheduler-${{ github.ref }}-${{ github.sha }}
  # Preserve the running full-population evidence during incremental delivery.
  cancel-in-progress: false

jobs:
  scheduler-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}/megatoken/src
      TRACING_JS_SELF_ROOT: ${{ github.workspace }}/tracing-js-self
      MEGATOKEN_ROOT: ${{ github.workspace }}/megatoken
      MEGATOKEN_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: werg/megatoken
          ref: 4fd7b561774f4dcda7d08b985909cd08a882df71
          path: megatoken
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: werg/tracing-js-self
          ref: ${{ github.sha }}
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: tracing-js-self/.nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install locked dependencies and the checked consumer
        run: |
          npm ci --prefix tracing-js-self --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tracing-js-self/tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
      - name: Emit canonical formatting without changing the checkout
        working-directory: megatoken
        shell: bash
        run: |
          python -m pip install ruff
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          paths=["src/megatoken/data/module_scheduler_state_v8.py","tests/test_module_scheduler_state_v8.py"]
          for name in paths:
              path=Path(name)
              original=path.read_text()
              fixed=subprocess.run([sys.executable,'-m','ruff','check','--fix-only','--stdin-filename',name,'-'],input=original,text=True,capture_output=True,check=False)
              candidate=fixed.stdout if fixed.stdout else original
              formatted=subprocess.run([sys.executable,'-m','ruff','format','--stdin-filename',name,'-'],input=candidate,text=True,capture_output=True,check=True).stdout
              if formatted!=original:
                  print('FORMATTED_SOURCE_JSON '+json.dumps({'path':name,'content':formatted}))
          PY
          python -m ruff check src/megatoken/data/module_scheduler_state_v8.py tests/test_module_scheduler_state_v8.py
          python -m ruff format --check src/megatoken/data/module_scheduler_state_v8.py tests/test_module_scheduler_state_v8.py
          python -m ruff check src/megatoken/data/async_call_v8.py src/megatoken/data/protocol_v8.py src/megatoken/data/promise_scheduler_v8.py src/megatoken/data/native_v8.py tests/test_async_call_v8.py
          python -m ruff format --check src/megatoken/data/async_call_v8.py src/megatoken/data/protocol_v8.py src/megatoken/data/promise_scheduler_v8.py src/megatoken/data/native_v8.py tests/test_async_call_v8.py
          python -m ruff check src/megatoken/data/module_scheduler_machine_v8.py tests/test_module_scheduler_machine_v8.py
          python -m ruff format --check src/megatoken/data/module_scheduler_machine_v8.py tests/test_module_scheduler_machine_v8.py
          git diff --exit-code --
      - name: Verify the paired contract and unchanged existing fixture population
        working-directory: tracing-js-self
        run: |
          node tools/generate-semantic-region-contract.mjs --check
          cmp contracts/semantic-execution-v8.json ../megatoken/src/megatoken/data/contracts/semantic-execution-v8.json
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          producer=json.loads(Path('test/fixtures/semantic-regions-v8.json').read_text())
          native=json.loads(gzip.decompress(base64.b64decode(Path('../megatoken/tests/fixtures/semantic-regions-v8.json.gz.b64').read_bytes())))
          if producer!=native or len(producer['examples'])!=6 or producer['interoperabilityDigest']!='f5c2d5fd15ad3b84e9b17de771d2f72a58f3c7dee4969ded8a7eb9c3c449f661':
              raise ValueError('Existing interoperability population or exact paired fixture changed')
          print('Paired public contract and all six existing interoperability payloads agree')
          PY
      - name: Check independent native scheduler state
        if: ${{ !cancelled() }}
        working-directory: megatoken
        run: |
          python -m pytest -q tests/test_module_scheduler_state_v8.py tests/test_module_scheduler_machine_v8.py tests/test_async_call_v8.py \
            tests/test_protocol_v8.py tests/test_protocol_boundaries_v8.py tests/test_promise_scheduler_v8.py \
            tests/test_promise_join_v8.py tests/test_promise_executor_v8.py tests/test_promise_executor_boundaries_v8.py \
            tests/test_generator_boundaries_v8.py \
            --junitxml="$RUNNER_TEMP/module-scheduler-native.xml" 2>&1 | tee "$RUNNER_TEMP/module-scheduler-native.log"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'module-scheduler-native.xml').getroot().iter('testcase'))
          if not cases or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every native scheduler and async composition control must run and pass')
          print(f'{len(cases)} native scheduler and async composition controls passed, zero skips')
          PY
      - name: Compare original ESM, owned scheduling and actual Python state
        if: ${{ !cancelled() }}
        working-directory: tracing-js-self
        run: |
          node --experimental-vm-modules --test --test-concurrency=1 --test-reporter=junit \
            test/evaluated-module-scheduler.test.js \
            test/semantic-module-scheduler-state-v8.test.js \
            test/semantic-native-module-scheduler-state-v8.test.js \
            test/semantic-module-scheduler-source-v8.test.js \
            2>&1 | tee "$RUNNER_TEMP/module-scheduler-js.xml"
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          cases=list(ET.parse(root/'module-scheduler-js.xml').getroot().iter('testcase'))
          if not cases or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every source/owned/cross-language scheduler control must run and pass')
          evidence=json.loads((root/'module-scheduler-state-evidence.json').read_text())
          if evidence['publicAdmission'] is not False or evidence['acceptedCuts']<1 or evidence['refusedCuts']<1:
              raise ValueError('Standalone scheduler comparison must retain both accepted and refused cuts without claiming admission')
          source=json.loads((root/'module-scheduler-source-evidence.json').read_text())
          if source['sourceCases']!=6 or source['actualNativeCases']!=6 or source['ownedTransitions']<1:
              raise ValueError('Every original source lifecycle must pass actual native transition replay')
          if source['publicAdmission'] is not False or source['trainingAdmission'] is not False or source['optimizerUpdates']!=0:
              raise ValueError('Source ownership alone cannot grant public/data admission or optimizer exposure')
          print(f'{len(cases)} original ESM and shared scheduler controls passed, zero skips')
          print('SCHEDULER_STATE_EVIDENCE_JSON '+json.dumps(evidence,separators=(',',':')))
          print('SCHEDULER_SOURCE_EVIDENCE_JSON '+json.dumps(source,separators=(',',':')))
          PY
      - name: Check shared generator and Promise composition against actual native replay
        if: ${{ !cancelled() }}
        working-directory: tracing-js-self
        run: |
          node --test --test-concurrency=1 --test-reporter=junit \
            test/semantic-protocol-generator-source-v8.test.js \
            test/semantic-protocol-promise-executor-source-v8.test.js \
            test/semantic-shared-protocol-source-v8.test.js \
            test/semantic-shared-generator-source-v8.test.js \
            2>&1 | tee "$RUNNER_TEMP/shared-generator-js.xml"
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          cases=list(ET.parse(root/'shared-generator-js.xml').getroot().iter('testcase'))
          if not cases or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every generator/Promise/composition control must run and pass')
          evidence=json.loads((root/'shared-generator-source-evidence.json').read_text())
          if evidence['sourceCases']!=6 or evidence['actualNativeCases']!=6 or evidence['generatedContexts']<1:
              raise ValueError('Every shared generator source case requires actual native replay of all contexts')
          if evidence['moduleAdmission'] is not False or evidence['trainingAdmission'] is not False or evidence['optimizerUpdates']!=0:
              raise ValueError('Generator composition alone cannot grant module/data admission or optimizer exposure')
          print(f'{len(cases)} shared generator and Promise controls passed, zero skips')
          print('SHARED_GENERATOR_EVIDENCE_SUMMARY_JSON '+json.dumps({key:value for key,value in evidence.items() if key!='cases'},separators=(',',':')))
          PY
      - name: Check nested async scopes against original source and actual native replay
        if: ${{ !cancelled() }}
        working-directory: tracing-js-self
        run: |
          node --test --test-concurrency=1 --test-reporter=junit test/semantic-async-call-source-v8.test.js \
            test/semantic-source-context-staging-v8.test.js \
            2>&1 | tee "$RUNNER_TEMP/nested-async-js.xml"
          python - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          cases=list(ET.parse(root/'nested-async-js.xml').getroot().iter('testcase'))
          if len(cases)!=20 or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every original-source async call and adversarial control must run and pass')
          evidence=json.loads((root/'nested-async-source-evidence.json').read_text())
          if evidence['sourceCases']!=10 or evidence['actualNativeCases']!=10 or evidence['generatedContexts']!=231:
              raise ValueError('Every original async source case requires actual native replay of every context')
          if evidence['moduleAdmission'] is not False or evidence['trainingAdmission'] is not False or evidence['optimizerUpdates']!=0:
              raise ValueError('Async helper composition cannot grant module/data admission or optimizer exposure')
          print(f'{len(cases)} nested async source and independent native controls passed, zero skips')
          print('NESTED_ASYNC_EVIDENCE_SUMMARY_JSON '+json.dumps({key:value for key,value in evidence.items() if key!='cases'},separators=(',',':')))
          PY
      - name: Compare original TLA source, public async records and independent native cuts
        if: ${{ !cancelled() }}
        working-directory: tracing-js-self
        run: |
          node tools/probe-module-async-source.mjs "$RUNNER_TEMP/nested-async-module-probe-evidence.json" \
            2>&1 | tee "$RUNNER_TEMP/nested-async-module-probe.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          evidence=json.loads((Path(os.environ['RUNNER_TEMP'])/'nested-async-module-probe-evidence.json').read_text())
          summary=evidence['summary']
          required={'modules':3,'ownedEvents':2012,'publicRecords':707,'protocolRecords':112,'detailedRecords':595,
              'generatedContexts':707,'ownedModuleCuts':10,'nativePublicCuts':10,'originalEsmReference':'passed',
              'finalSharedStateEqual':True,'moduleAdmission':False,'trainingAdmission':False,'optimizerUpdates':0}
          if any(summary[key]!=value for key,value in required.items()):
              raise ValueError('Original module engineering probe changed population, state parity or admission boundary')
          receipt=summary['nativeReceipt']
          if receipt['admitted'] is not False or any(receipt['checks'][key]!='passed' for key in ('replay','contexts','continuation')):
              raise ValueError('Every original-module public context must pass actual native replay without claiming admission')
          print('All 707 original-module public contexts and ten uniquely owned lifecycle cuts passed actual native replay')
          PY
      - name: Enforce original-module lifecycle in the active public and native ledger
        if: ${{ !cancelled() }}
        working-directory: tracing-js-self
        env:
          BOUND_MODULE_SOURCE_EVIDENCE: ${{ runner.temp }}/bound-module-source-evidence.json
        run: |
          node --test --test-concurrency=1 --test-reporter=junit test/semantic-bound-module-scheduler-v8.test.js \
            2>&1 | tee "$RUNNER_TEMP/bound-module-source.xml"
          python - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          cases=list(ET.parse(root/'bound-module-source.xml').getroot().iter('testcase'))
          if len(cases)!=11 or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every source-bound ledger and independent native control must run and pass')
          summary=json.loads((root/'bound-module-source-evidence.json').read_text())['summary']
          required={'cases':4,'modules':13,'contexts':2838,'moduleCuts':39,'nativeCases':4,'nativeContexts':2838,
              'nativeModuleCuts':39,'refusedStates':10,'refusedPlans':6,'moduleAdmission':False,'trainingAdmission':False,'optimizerUpdates':0}
          if any(summary[key]!=value for key,value in required.items()):
              raise ValueError('Source-bound ledger population, independent state parity or admission boundary changed')
          print('BOUND_MODULE_SOURCE_EVIDENCE_SUMMARY_JSON '+json.dumps(summary,separators=(',',':')))
          print('All 2838 source-bound public contexts and all 39 module-cut checkpoints passed independent native replay')
          PY
      - name: Verify both candidate checkouts remained exact
        if: ${{ !cancelled() }}
        run: |
          test -z "$(git -C megatoken status --porcelain --untracked-files=all)"
          test -z "$(git -C tracing-js-self status --porcelain --untracked-files=all)"
          git -C megatoken rev-parse HEAD
          git -C tracing-js-self rev-parse HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: module-scheduler-state-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/module-scheduler-*
            ${{ runner.temp }}/shared-generator-*
            ${{ runner.temp }}/nested-async-*
            ${{ runner.temp }}/bound-module-*
