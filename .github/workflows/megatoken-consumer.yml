name: Pinned semantic v5 source and native admission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-v5-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-native-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        recipe: [engineering, training-v4, benchmark-v1, real-source, generated-v1]
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: 6206b33a55eba3e50f80498f906439221bc289b7 # isolate mutable replay state from immutable observed input graphs
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install paired producer and native consumer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
      - name: Acquire and verify immutable production tokenizer
        run: |
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from megatoken.generation.codec import LING_REPOSITORY, LING_REVISION, LING_TOKENIZER_SHA256
          source = hf_hub_download(LING_REPOSITORY, 'tokenizer.json', revision=LING_REVISION)
          target = Path(os.environ['RUNNER_TEMP']) / 'tokenizer.json'
          shutil.copyfile(source, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == LING_TOKENIZER_SHA256
          PY
      - name: Bind actual native runtime and all dependency identities
        run: |
          python tools/native-consumer/check_environment.py --megatoken megatoken \
            --tokenizer "$RUNNER_TEMP/tokenizer.json" --out "$RUNNER_TEMP/native-environment.json"
          python -m unittest discover -s tools/native-consumer -p 'test_*.py'
      - name: Qualify native semantic boundary and input-mutation probes
        if: matrix.recipe == 'engineering'
        run: |
          node tools/generate-capability-ledger.mjs --out "$RUNNER_TEMP/native-capabilities.json" \
            --cases scalar-arithmetic,slice-undefined-end,parameter-body-scope,later-parameter-tdz,synchronous-primitive-throw,synchronous-declared-error,alias-preserving-mutation,input-array-mutation \
            --megatoken megatoken --python python --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --native-policy contracts/native-admission-policy-v5.json
      - name: Validate shared schemas and independently source-check every corpus family
        run: |
          npm run contracts:check
          cmp contracts/host-operations-v4.json megatoken/src/megatoken/data/contracts/host-operations-v4.json
          cmp contracts/semantic-harness-v5.json megatoken/src/megatoken/data/contracts/semantic-harness-v5.json
          node tools/freeze-source-registry.mjs --out "$RUNNER_TEMP/source-registry.json" \
            --holdout-projects exercism/javascript --holdout-compositions square/even/maximum/alias/return
          require_native=(--require-native)
          if [[ '${{ matrix.recipe }}' == 'real-source' ]]; then
            # Real upstream candidates retain every unsupported/refused row;
            # the release step rechecks and prepares only actual admissions.
            require_native=()
          fi
          node tools/generate-effectful-training.mjs --recipe '${{ matrix.recipe }}' --jobs 3 --out "$RUNNER_TEMP/corpus" \
            --registry "$RUNNER_TEMP/source-registry.json" \
            --megatoken megatoken --python python --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --native-policy contracts/native-admission-policy-v5.json "${require_native[@]}"
          node tools/generate-selected-harness-v4.mjs "$RUNNER_TEMP/two-invocations.json"
          node tools/generate-selected-continuity-v4.mjs "$RUNNER_TEMP/continuity"
      - name: Recheck admitted evidence and export real native training data without optimizing
        if: matrix.recipe != 'real-source'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from megatoken.data.semantic_harness_v5 import adapt_selected_harness_v5
          from megatoken.generation.codec import ByteCodec, LING_TOKENIZER_SHA256
          root = Path(os.environ['RUNNER_TEMP'])
          corpus = root / 'corpus'
          manifest = json.loads((corpus / 'manifest.json').read_text())
          assert manifest['counts']['admitted'] == manifest['counts']['attempted']
          assert manifest['optimizerSteps'] == 0 and manifest['learnedSuccess'] is None
          producer = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          consumer = subprocess.check_output(['git','-C','megatoken','rev-parse','HEAD'], text=True).strip()
          subprocess.run([sys.executable,'megatoken/scripts/validate_semantic_corpus.py',
            '--corpus',str(corpus),'--output',str(root/'prepared-semantic'),
            '--tracer-root','.',
            '--tokenizer-json',str(root/'tokenizer.json')], check=True)
          codec = ByteCodec.from_tokenizer_json(root/'tokenizer.json', expected_sha256=LING_TOKENIZER_SHA256)
          paths = [root/'two-invocations.json', *sorted((root/'continuity').glob('*.json'))]
          for path in paths:
              if path.name == 'manifest.json': continue
              episode, receipt = adapt_selected_harness_v5(json.loads(path.read_text()), codec=codec,
                allow_local=True, max_positions=1024, max_history=1024)
              assert episode.records and episode.supervision.outcome == 'unknown'
          PY
      - name: Freeze and evaluate held-out engineering cohort through real selected driver
        if: matrix.recipe == 'engineering'
        run: |
          python megatoken/scripts/check_semantic_inference.py \
            --tokenizer-json "$RUNNER_TEMP/tokenizer.json" --output "$RUNNER_TEMP/native-inference"
          MEGATOKEN_ORCHESTRATION_SERVED="$RUNNER_TEMP/native-inference/served" \
          MEGATOKEN_PYTHON="$(command -v python)" \
          MEGATOKEN_REPOSITORY="$GITHUB_WORKSPACE/megatoken" \
          MEGATOKEN_ORCHESTRATION_EVIDENCE_DIR="$RUNNER_TEMP/native-orchestration" \
          OMP_NUM_THREADS=1 node --test test/training-orchestration-evaluation.test.js
          python megatoken/scripts/validate_semantic_orchestration.py \
            --evidence-dir "$RUNNER_TEMP/native-orchestration" \
            --tokenizer-json "$RUNNER_TEMP/tokenizer.json" \
            --output "$RUNNER_TEMP/native-orchestration-validation.json"
          node tools/freeze-selected-evaluation.mjs "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/declaration.json" --with-orchestration
          python megatoken/scripts/evaluate_semantic.py freeze \
            --declaration "$RUNNER_TEMP/declaration.json" --output "$RUNNER_TEMP/cohort.json"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          model_args = ['megatoken/scripts/serve_selected_semantic.py',
            '--served',str(root/'native-inference'/'served'), '--device','cpu',
            '--max-tokens','8','--controlled-lifecycle-fixtures']
          runner = ['node','tools/run-selected-evaluation.mjs','--model-command',sys.executable,
            '--model-args',json.dumps(model_args),'--timeout-ms','120000']
          subprocess.run([sys.executable,'megatoken/scripts/evaluate_semantic.py','run',
            '--cohort',str(root/'cohort.json'),'--runner-argv',json.dumps(runner),
            '--origin','controlled','--seed','17','--timeout','180', '--require-engineering-success',
            '--tokenizer-json',str(root/'tokenizer.json'),'--output',str(root/'evaluation.json')],
            env={**os.environ,'OMP_NUM_THREADS':'1'},check=True)
          report = json.loads((root/'evaluation.json').read_text())
          assert all(row['wholeTaskSuccess'] and row['traceValid'] for row in report['cases'])
          PY
      - name: Package complete rechecked native release and rejection evidence
        run: |
          python tools/package-semantic-release.py --corpus "$RUNNER_TEMP/corpus" \
            --tracer-root . --megatoken megatoken --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --environment-receipt "$RUNNER_TEMP/native-environment.json" --out "$RUNNER_TEMP/release"
          python tools/package-semantic-release.py --verify "$RUNNER_TEMP/release/semantic-v5-release.tar.gz"
      - name: Reconcile all source dispositions and independent family counts
        run: |
          python - <<'PY'
          import collections, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'corpus/manifest.json').read_text())
          counts = collections.Counter(row['status'] for row in manifest['cases'])
          assert sum(counts.values()) == manifest['counts']['attempted']
          assert counts['admitted'] > 0, 'A native qualification lane must yield actual admitted examples'
          assert all(manifest['counts'].get(key) == value for key, value in counts.items())
          summary = {'schema':'semantic-source-dispositions/1', 'producerRevision':manifest['producerRevision'],
            'recipe':manifest['recipe'], 'attempted':len(manifest['cases']), 'dispositions':dict(counts),
            'admittedFamilies':len({row['family'] for row in manifest['cases'] if row['status']=='admitted'}),
            'admittedComponents':len({row['sourceCluster'] for row in manifest['cases'] if row['status']=='admitted'}),
            'optimizerSteps':0, 'learnedSuccess':None}
          (root / 'source-dispositions.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - name: Retain complete corpus, prepared shards and actionable refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v5-${{ matrix.recipe }}-admission-and-evaluation
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/corpus/
            ${{ runner.temp }}/prepared-semantic/
            ${{ runner.temp }}/release/
            ${{ runner.temp }}/native-environment.json
            ${{ runner.temp }}/native-capabilities.json
            ${{ runner.temp }}/source-registry.json
            ${{ runner.temp }}/source-dispositions.json
            ${{ runner.temp }}/evaluation.json
            ${{ runner.temp }}/continuity/*.txt
            ${{ runner.temp }}/native-inference/inference-check.json
            ${{ runner.temp }}/native-orchestration-validation.json
          if-no-files-found: error
