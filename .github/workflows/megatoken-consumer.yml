name: Pinned semantic v5 source and native admission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-v5-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-native-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        recipe: [engineering, training-v4, benchmark-v1, real-source, generated-v1]
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NATIVE_WORKFLOW_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: 9a9dd3593c6887d63012dd5c953e914557dca386 # semantic observation/control alignment; fresh schema 7 and checkpoint 19
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Record durable producer and workflow trigger identities
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = {
            'schema': 'semantic-native-ci-identity/1',
            'workflowRunId': os.environ['GITHUB_RUN_ID'],
            'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'workflowTriggerRevision': os.environ['GITHUB_SHA'],
            'workflowHeadRevision': os.environ['NATIVE_WORKFLOW_HEAD_REVISION'],
            'producerRevision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'consumerRevision': subprocess.check_output(['git', '-C', 'megatoken', 'rev-parse', 'HEAD'], text=True).strip(),
          }
          assert receipt['producerRevision'] == receipt['workflowHeadRevision']
          (Path(os.environ['RUNNER_TEMP']) / 'native-run-identity.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Install paired producer and native consumer
        run: |
          release_npm_version="$(node -p "require('./profiles/release-environment.lock.json').npm")"
          npm install --global "npm@$release_npm_version" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$release_npm_version"
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
      - name: Acquire and verify immutable production tokenizer
        run: |
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from megatoken.generation.codec import LING_REPOSITORY, LING_REVISION, LING_TOKENIZER_SHA256
          source = hf_hub_download(LING_REPOSITORY, 'tokenizer.json', revision=LING_REVISION)
          target = Path(os.environ['RUNNER_TEMP']) / 'tokenizer.json'
          shutil.copyfile(source, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == LING_TOKENIZER_SHA256
          PY
      - name: Bind actual native runtime and all dependency identities
        run: |
          python tools/native-consumer/check_environment.py --megatoken megatoken \
            --tokenizer "$RUNNER_TEMP/tokenizer.json" --out "$RUNNER_TEMP/native-environment.json"
          python -m unittest discover -s tools/native-consumer -p 'test_*.py'
      - name: Check release, alias and learning-evidence refusal boundaries
        if: matrix.recipe == 'engineering'
        env:
          MEGATOKEN_ROOT: ${{ github.workspace }}/megatoken
          MEGATOKEN_REPOSITORY: ${{ github.workspace }}/megatoken
        run: |
          python -m pytest -q test/test_*.py --junitxml="$RUNNER_TEMP/python-release-regressions.xml"
      - name: Qualify native semantic boundary and input-mutation probes
        if: matrix.recipe == 'engineering'
        run: |
          node tools/generate-capability-ledger.mjs --out "$RUNNER_TEMP/native-capabilities.json" \
            --cases scalar-arithmetic,slice-undefined-end,parameter-body-scope,later-parameter-tdz,synchronous-primitive-throw,synchronous-declared-error,alias-preserving-mutation,input-array-mutation,array-some-short-circuit,array-for-each-owned-callback,sparse-array-fill,input-graph-mutation,parameter-camelcase-default-capture,primitive-number-conversion,primitive-bigint-conversion,invalid-bigint-catch-and-throw,primitive-string-conversion,forward-parameter-closure,sync-root-async-helper-rejection \
            --megatoken megatoken --python python --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --native-policy contracts/native-admission-policy-v5.json
      - name: Validate shared schemas and independently source-check every corpus family
        run: |
          npm run contracts:check
          cmp contracts/host-operations-v4.json megatoken/src/megatoken/data/contracts/host-operations-v4.json
          cmp contracts/semantic-harness-v5.json megatoken/src/megatoken/data/contracts/semantic-harness-v5.json
          node tools/freeze-source-registry.mjs --out "$RUNNER_TEMP/source-registry.json" \
            --holdout-projects exercism/javascript --holdout-compositions square/even/maximum/alias/return
          require_native=(--require-native)
          if [[ '${{ matrix.recipe }}' == 'real-source' ]]; then
            # Real upstream candidates retain every unsupported/refused row;
            # the release step rechecks and prepares only actual admissions.
            require_native+=(--allow-refusals)
          fi
          node tools/generate-effectful-training.mjs --recipe '${{ matrix.recipe }}' --jobs 3 --out "$RUNNER_TEMP/corpus" \
            --registry "$RUNNER_TEMP/source-registry.json" \
            --megatoken megatoken --python python --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --native-policy contracts/native-admission-policy-v5.json "${require_native[@]}"
          node tools/generate-selected-harness-v4.mjs "$RUNNER_TEMP/two-invocations.json"
          node tools/generate-selected-continuity-v4.mjs "$RUNNER_TEMP/continuity"
      - name: Recheck admitted evidence and export real native training data without optimizing
        if: matrix.recipe != 'real-source'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from megatoken.data.semantic_harness_v5 import adapt_selected_harness_v5
          from megatoken.generation.codec import ByteCodec, LING_TOKENIZER_SHA256
          root = Path(os.environ['RUNNER_TEMP'])
          corpus = root / 'corpus'
          manifest = json.loads((corpus / 'manifest.json').read_text())
          assert manifest['counts']['admitted'] == manifest['counts']['attempted']
          assert manifest['optimizerSteps'] == 0 and manifest['learnedSuccess'] is None
          producer = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          consumer = subprocess.check_output(['git','-C','megatoken','rev-parse','HEAD'], text=True).strip()
          subprocess.run([sys.executable,'megatoken/scripts/validate_semantic_corpus.py',
            '--corpus',str(corpus),'--output',str(root/'prepared-semantic'),
            '--tracer-root','.',
            '--tokenizer-json',str(root/'tokenizer.json')], check=True)
          codec = ByteCodec.from_tokenizer_json(root/'tokenizer.json', expected_sha256=LING_TOKENIZER_SHA256)
          paths = [root/'two-invocations.json', *sorted((root/'continuity').glob('*.json'))]
          for path in paths:
              if path.name == 'manifest.json': continue
              episode, receipt = adapt_selected_harness_v5(json.loads(path.read_text()), codec=codec,
                allow_local=True, max_positions=1024, max_history=1024)
              assert episode.records and episode.supervision.outcome == 'unknown'
          PY
      - name: Verify actual first-invocation observation and control bytes
        if: matrix.recipe == 'engineering'
        run: |
          python tools/native_input_parity.py --consumer-root megatoken \
            --episode "$RUNNER_TEMP/corpus/compound-pure.json" \
            --max-capacity 1024 --max-tokens 128 --out "$RUNNER_TEMP/native-input-parity.json"
      - name: Capture actual native conditionals and retain the scientific verdict
        if: matrix.recipe == 'engineering'
        run: |
          set +e
          python tools/probe-native-conditionals.py --consumer-root megatoken \
            --episode "$RUNNER_TEMP/corpus/compound-pure.json" \
            --initialize-tiny --tokenizer-json "$RUNNER_TEMP/tokenizer.json" \
            --seed 17 --max-tokens 128 --atol 0.000001 --rtol 0.00001 \
            --output "$RUNNER_TEMP/native-conditional-probe"
          diagnostic_exit=$?
          set -e
          python - "$diagnostic_exit" <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'native-conditional-probe'
          report = json.loads((root / 'report.json').read_text())
          # A completed measurement can find a real mismatch. Preserve that
          # failed parity verdict; this step checks completion of the diagnostic,
          # not successful learning or a passing training/serving parity gate.
          assert report['phase'] == 'complete', report.get('error')
          assert report['status'] in ('failed', 'measured')
          assert int(sys.argv[1]) == (1 if report['status'] == 'failed' else 0)
          assert report['modelSelections'] == 0 and report['optimizerSteps'] == 0
          assert report['fullConditionalParityClaim'] is False
          verdict = {key: report[key] for key in ('status', 'gaussianConditionalStatus',
            'trainingServingParityStatus', 'fullConditionalParityClaim', 'modelSelections', 'optimizerSteps')}
          print(json.dumps(verdict))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Native conditional diagnostic\n\n')
              out.write('The measurement completed. Training/serving parity verdict: **' +
                report['trainingServingParityStatus'] + '**. No returned semantic selections or optimizer updates ran.\n')
              out.write('Capture stopped before the Gaussian facet draw; serving executed its earlier text-only modality categorical.\n')
              out.write('A successful workflow step records a completed diagnosis; it does not turn a failed parity result into a pass.\n')
          PY
      - name: Freeze and evaluate held-out engineering cohort through real selected driver
        if: matrix.recipe == 'engineering'
        run: |
          python megatoken/scripts/check_semantic_inference.py \
            --tokenizer-json "$RUNNER_TEMP/tokenizer.json" --output "$RUNNER_TEMP/native-inference"
          MEGATOKEN_ORCHESTRATION_SERVED="$RUNNER_TEMP/native-inference/served" \
          MEGATOKEN_PYTHON="$(command -v python)" \
          MEGATOKEN_REPOSITORY="$GITHUB_WORKSPACE/megatoken" \
          MEGATOKEN_ORCHESTRATION_EVIDENCE_DIR="$RUNNER_TEMP/native-orchestration" \
          OMP_NUM_THREADS=1 node --test test/training-orchestration-evaluation.test.js
          python megatoken/scripts/validate_semantic_orchestration.py \
            --evidence-dir "$RUNNER_TEMP/native-orchestration" \
            --tokenizer-json "$RUNNER_TEMP/tokenizer.json" \
            --output "$RUNNER_TEMP/native-orchestration-validation.json"
          node tools/freeze-selected-evaluation.mjs "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/declaration.json" --with-orchestration
          python megatoken/scripts/evaluate_semantic.py freeze \
            --declaration "$RUNNER_TEMP/declaration.json" --output "$RUNNER_TEMP/cohort.json"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          model_args = ['megatoken/scripts/serve_selected_semantic.py',
            '--served',str(root/'native-inference'/'served'), '--device','cpu',
            '--max-tokens','8','--controlled-lifecycle-fixtures']
          runner = ['node','tools/run-selected-evaluation.mjs','--model-command',sys.executable,
            '--model-args',json.dumps(model_args),'--timeout-ms','120000']
          subprocess.run([sys.executable,'megatoken/scripts/evaluate_semantic.py','run',
            '--cohort',str(root/'cohort.json'),'--runner-argv',json.dumps(runner),
            '--origin','controlled','--seed','17','--timeout','180', '--require-engineering-success',
            '--tokenizer-json',str(root/'tokenizer.json'),'--output',str(root/'evaluation.json')],
            env={**os.environ,'OMP_NUM_THREADS':'1'},check=True)
          report = json.loads((root/'evaluation.json').read_text())
          assert all(row['wholeTaskSuccess'] and row['traceValid'] for row in report['cases'])
          PY
      - name: Package complete rechecked native release and rejection evidence
        run: |
          training_caps=()
          if [[ '${{ matrix.recipe }}' == 'real-source' || '${{ matrix.recipe }}' == 'generated-v1' ]]; then
            training_caps=(--max-family-tokens 10000 --max-family-share 0.2)
          fi
          release_corpus="$RUNNER_TEMP/corpus"
          audit_args=()
          if [[ '${{ matrix.recipe }}' == 'real-source' ]]; then
            # Distinct task IDs can share one exact public stream. Keep the
            # complete original audit and select authenticated representatives
            # before native preparation enforces immutable episode identities.
            node tools/select-admitted-campaign.mjs --input "$RUNNER_TEMP/corpus" \
              --out "$RUNNER_TEMP/selected-corpus" --deduplicate-exact-public true --tracer-root .
            release_corpus="$RUNNER_TEMP/selected-corpus"
            audit_args=(--audit-campaign "$RUNNER_TEMP/corpus")
          fi
          python tools/package-semantic-release.py --corpus "$release_corpus" \
            --tracer-root . --megatoken megatoken --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --environment-receipt "$RUNNER_TEMP/native-environment.json" --out "$RUNNER_TEMP/release" \
            "${audit_args[@]}" "${training_caps[@]}"
          python tools/package-semantic-release.py --verify "$RUNNER_TEMP/release/semantic-v5-release.tar.gz"
      - name: Reconstruct every prepared native row and measure coverage membership
        run: |
          python tools/derive-native-prepared-sampler.py \
            --prepared "$RUNNER_TEMP/release/prepared" \
            --audit-campaign "$RUNNER_TEMP/corpus" --producer-root . \
            --megatoken megatoken --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --max-family-tokens 10000 --max-family-share 0.20 \
            --out "$RUNNER_TEMP/native-prepared-sampler"
          node tools/select-native-prepared-coverage.mjs \
            --sampler "$RUNNER_TEMP/native-prepared-sampler/sampler.json" \
            --source-manifest "$RUNNER_TEMP/corpus/manifest.json" \
            --out "$RUNNER_TEMP/native-prepared-coverage"
      - name: Reconcile all source dispositions and independent family counts
        run: |
          python - <<'PY'
          import collections, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'corpus/manifest.json').read_text())
          counts = collections.Counter(row['status'] for row in manifest['cases'])
          assert sum(counts.values()) == manifest['counts']['attempted']
          assert counts['admitted'] > 0, 'A native qualification lane must yield actual admitted examples'
          assert all(manifest['counts'].get(key) == value for key, value in counts.items())
          summary = {'schema':'semantic-source-dispositions/1', 'producerRevision':manifest['producerRevision'],
            'recipe':manifest['recipe'], 'attempted':len(manifest['cases']), 'dispositions':dict(counts),
            'admittedFamilies':len({row['family'] for row in manifest['cases'] if row['status']=='admitted'}),
            'admittedComponents':len({row['sourceCluster'] for row in manifest['cases'] if row['status']=='admitted'}),
            'optimizerSteps':0, 'learnedSuccess':None}
          (root / 'source-dispositions.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - name: Retain complete corpus, prepared shards and actionable refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v5-${{ matrix.recipe }}-admission-and-evaluation
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/corpus/
            !${{ runner.temp }}/corpus/.native/**
            !${{ runner.temp }}/corpus/.workers/**
            ${{ runner.temp }}/selected-corpus/
            ${{ runner.temp }}/prepared-semantic/
            ${{ runner.temp }}/release/
            ${{ runner.temp }}/native-environment.json
            ${{ runner.temp }}/python-release-regressions.xml
            ${{ runner.temp }}/native-run-identity.json
            ${{ runner.temp }}/native-capabilities.json
            ${{ runner.temp }}/source-registry.json
            ${{ runner.temp }}/source-dispositions.json
            ${{ runner.temp }}/evaluation.json
            ${{ runner.temp }}/continuity/*.txt
            ${{ runner.temp }}/native-inference/inference-check.json
            ${{ runner.temp }}/native-orchestration-validation.json
            ${{ runner.temp }}/native-input-parity.json
            ${{ runner.temp }}/native-conditional-probe/
            ${{ runner.temp }}/native-prepared-sampler/
            ${{ runner.temp }}/native-prepared-sampler.building/
            ${{ runner.temp }}/native-prepared-coverage/
          if-no-files-found: error

  restore-engineering-release:
    needs: independent-native-import
    # The restore verifies its own engineering archive and every original
    # positive attempt even if another corpus recipe reports a refusal.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the original producer's locked dependencies
        run: |
          release_npm_version="$(node -p "require('./profiles/release-environment.lock.json').npm")"
          npm install --global "npm@$release_npm_version" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$release_npm_version"
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: semantic-v5-engineering-admission-and-evaluation
          path: ${{ runner.temp }}/downloaded-native-engineering
      - name: Restore the original archive and replay every positive attempt
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          downloaded = Path(os.environ['RUNNER_TEMP']) / 'downloaded-native-engineering'
          archive = downloaded / 'release/semantic-v5-release.tar.gz'
          receipt_path = downloaded / 'release/archive-receipt.json'
          receipt = json.loads(receipt_path.read_text())
          out = Path(os.environ['RUNNER_TEMP']) / 'restored-native-engineering'
          subprocess.run([sys.executable, 'tools/restore-semantic-release.py',
            '--archive', str(archive), '--archive-sha256', receipt['archiveSha256'],
            '--tracer-root', '.', '--out', str(out)], check=True)
          identity = {'schema': 'semantic-release-hosted-restore/1',
            'producerRevision': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'job': os.environ['GITHUB_JOB'], 'runnerName': os.environ['RUNNER_NAME'],
            'runnerOS': os.environ['RUNNER_OS'], 'runnerArch': os.environ['RUNNER_ARCH'],
            'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'),
            'artifactName': 'semantic-v5-engineering-admission-and-evaluation',
            'archiveSha256': receipt['archiveSha256'],
            'originalArchiveReceiptSha256': hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
            'restoreReceiptSha256': hashlib.sha256((out/'restore.json').read_bytes()).hexdigest(),
            'scope': 'Separate GitHub-hosted job: original archive inventory and source replay; native requalification untested'}
          (out/'hosted-job.json').write_text(json.dumps(identity, indent=2)+'\n')
          print(json.dumps(identity))
          PY
      - name: Preserve restore identity, inventory and replay receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v5-engineering-restore-drill
          retention-days: 90
          path: |
            ${{ runner.temp }}/restored-native-engineering/restore.json
            ${{ runner.temp }}/restored-native-engineering/hosted-job.json
            ${{ runner.temp }}/restored-native-engineering/checks/
          if-no-files-found: error
