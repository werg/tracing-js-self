name: Pinned semantic-execution/3 native consumer contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-v3-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-native-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: a687acb9434373ffc758b1d98cea031f2af9cead # paired semantic-execution/3 native tests
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tracer and native consumer
        run: |
          npm ci
          python -m pip install -e ./megatoken pytest
      - name: Generate verified semantic-execution/3 candidates
        run: |
          npm run training:generate -- --seed 42 --count 16 \
            --output "$RUNNER_TEMP/trace.jsonl" \
            --manifest "$RUNNER_TEMP/manifest.json"
          npm run training:recheck -- "$RUNNER_TEMP/trace.jsonl"
      - name: Import native Episode v3 with no legacy format fallback
        run: |
          python megatoken/scripts/import_semantic_execution.py \
            --input "$RUNNER_TEMP/trace.jsonl" \
            --output "$RUNNER_TEMP/native.jsonl" \
            --diagnostic-byte --allow-local
          python -m pytest -q megatoken/tests/test_semantic_execution.py
      - name: Assert exact public bytes and observed/generated loss
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from megatoken.data.schema import Episode
          base=Path(os.environ['RUNNER_TEMP'])
          source=[json.loads(s) for s in (base/'trace.jsonl').read_text().splitlines() if s]
          native=[Episode.from_dict(json.loads(s)) for s in
                  (base/'native.jsonl').read_text().splitlines() if s]
          manifest=json.loads((base/'manifest.json').read_text())
          assert source and len(source)==len(native)==manifest['counts']['locally_verified']
          assert manifest['counts']['admitted']==0
          for exported,episode in zip(source,native,strict=True):
              assert exported['public']['schema']=='semantic-execution/3'
              assert exported['sidecar']['schema']=='semantic-supervision/2'
              groups=exported['public']['groups']
              assert [r.payload for r in episode.records]==[
                  e['record'].encode('utf8') for g in groups for e in g['events']]
              assert [r.policy_mask for r in episode.records]==[
                  g['mode']=='generated' for g in groups for _ in g['events']]
              assert episode.supervision.outcome=='unknown'
              assert all(b'archive' not in r.payload and b'sidecar' not in r.payload
                         for r in episode.records)
          print('Sole v3 native schema imported with byte/loss integrity; admitted=0')
          PY
