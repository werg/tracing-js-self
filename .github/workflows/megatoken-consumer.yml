name: Pinned semantic v4 source and native admission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-v4-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-native-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: 07a3f75cd1fde41a85f7f9bf2f9d4fdce4fd45ea # companion Megatoken PR #29: completed canonical integration and delivery fixes
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install paired producer and native consumer
        run: |
          npm ci
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'safetensors>=0.5,<1'
          python -m pip install -e ./megatoken pytest tokenizers huggingface-hub
      - name: Acquire and verify immutable production tokenizer
        run: |
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from megatoken.generation.codec import LING_REPOSITORY, LING_REVISION, LING_TOKENIZER_SHA256
          source = hf_hub_download(LING_REPOSITORY, 'tokenizer.json', revision=LING_REVISION)
          target = Path(os.environ['RUNNER_TEMP']) / 'tokenizer.json'
          shutil.copyfile(source, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == LING_TOKENIZER_SHA256
          PY
      - name: Validate shared schemas and independently source-check every corpus family
        run: |
          npm run contracts:check
          cmp contracts/host-operations-v4.json megatoken/src/megatoken/data/contracts/host-operations-v4.json
          cmp contracts/semantic-harness-v5.json megatoken/src/megatoken/data/contracts/semantic-harness-v5.json
          node tools/generate-effectful-training.mjs --jobs 4 --out "$RUNNER_TEMP/corpus" \
            --megatoken megatoken --python python --tokenizer "$RUNNER_TEMP/tokenizer.json" --require-native
          node tools/generate-selected-harness-v4.mjs "$RUNNER_TEMP/two-invocations.json"
          node tools/generate-selected-continuity-v4.mjs "$RUNNER_TEMP/continuity"
      - name: Recheck admitted evidence and export real native training data without optimizing
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from megatoken.data.semantic_harness_v4 import adapt_selected_harness_v4
          from megatoken.generation.codec import ByteCodec, LING_TOKENIZER_SHA256
          root = Path(os.environ['RUNNER_TEMP'])
          corpus = root / 'corpus'
          manifest = json.loads((corpus / 'manifest.json').read_text())
          assert manifest['counts']['admitted'] == manifest['counts']['attempted']
          assert manifest['optimizerSteps'] == 0 and manifest['learnedSuccess'] is None
          producer = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          consumer = subprocess.check_output(['git','-C','megatoken','rev-parse','HEAD'], text=True).strip()
          subprocess.run([sys.executable,'megatoken/scripts/validate_semantic_corpus.py',
            '--corpus',str(corpus),'--output',str(root/'prepared-semantic'),
            '--tracer-root','.',
            '--tokenizer-json',str(root/'tokenizer.json')], check=True)
          codec = ByteCodec.from_tokenizer_json(root/'tokenizer.json', expected_sha256=LING_TOKENIZER_SHA256)
          paths = [root/'two-invocations.json', *sorted((root/'continuity').glob('*.json'))]
          for path in paths:
              if path.name == 'manifest.json': continue
              episode, receipt = adapt_selected_harness_v4(json.loads(path.read_text()), codec=codec,
                allow_local=True, max_positions=1024, max_history=1024)
              assert episode.records and episode.supervision.outcome == 'unknown'
          PY
      - name: Freeze and evaluate held-out engineering cohort through real selected driver
        run: |
          python megatoken/scripts/check_semantic_inference.py \
            --tokenizer-json "$RUNNER_TEMP/tokenizer.json" --output "$RUNNER_TEMP/native-inference"
          MEGATOKEN_ORCHESTRATION_SERVED="$RUNNER_TEMP/native-inference/served" \
          MEGATOKEN_PYTHON="$(command -v python)" \
          MEGATOKEN_REPOSITORY="$GITHUB_WORKSPACE/megatoken" \
          MEGATOKEN_ORCHESTRATION_EVIDENCE_DIR="$RUNNER_TEMP/native-orchestration" \
          OMP_NUM_THREADS=1 node --test test/training-orchestration-evaluation.test.js
          python megatoken/scripts/validate_semantic_orchestration.py \
            --evidence-dir "$RUNNER_TEMP/native-orchestration" \
            --tokenizer-json "$RUNNER_TEMP/tokenizer.json" \
            --output "$RUNNER_TEMP/native-orchestration-validation.json"
          node tools/freeze-selected-evaluation.mjs "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/declaration.json" --with-orchestration
          python megatoken/scripts/evaluate_semantic.py freeze \
            --declaration "$RUNNER_TEMP/declaration.json" --output "$RUNNER_TEMP/cohort.json"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          model_args = ['megatoken/scripts/serve_selected_semantic.py',
            '--served',str(root/'native-inference'/'served'), '--device','cpu',
            '--max-tokens','8','--controlled-lifecycle-fixtures']
          runner = ['node','tools/run-selected-evaluation.mjs','--model-command',sys.executable,
            '--model-args',json.dumps(model_args),'--timeout-ms','120000']
          subprocess.run([sys.executable,'megatoken/scripts/evaluate_semantic.py','run',
            '--cohort',str(root/'cohort.json'),'--runner-argv',json.dumps(runner),
            '--origin','controlled','--seed','17','--timeout','180', '--require-engineering-success',
            '--tokenizer-json',str(root/'tokenizer.json'),'--output',str(root/'evaluation.json')],
            env={**os.environ,'OMP_NUM_THREADS':'1'},check=True)
          report = json.loads((root/'evaluation.json').read_text())
          assert all(row['wholeTaskSuccess'] and row['traceValid'] for row in report['cases'])
          PY
      - name: Retain auditable receipts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v4-admission-and-evaluation
          path: |
            ${{ runner.temp }}/corpus/manifest.json
            ${{ runner.temp }}/evaluation.json
            ${{ runner.temp }}/continuity/*.txt
            ${{ runner.temp }}/native-inference/inference-check.json
            ${{ runner.temp }}/native-orchestration-validation.json
          if-no-files-found: error
