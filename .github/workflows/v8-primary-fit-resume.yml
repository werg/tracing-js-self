name: Continue original V8 checkpoint314 for exactly34 updates

on:
  push:
    branches: [codex/v8-primary-fit-resume-20261122]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v8-primary-fit-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: continuation-driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9cf091e6ccc5add960ef0897576d0c391b199a65
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: 1a69d9da3254b7568c831d12866a629c206cf4fe
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the original locked runtime and verify driver refusals
        run: |
          npm ci --prefix tracing-js-self --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tracing-js-self/tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
          python -m unittest discover -s continuation-driver/tools -p test_resume_v8_frozen_target_coverage.py -v \
            2>&1 | tee "$RUNNER_TEMP/frozen-continuation-controls.log"
      - name: Download byte-original failed campaign archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/werg/tracing-js-self/actions/artifacts/14759987389/zip > "$RUNNER_TEMP/v8-primary-original.zip"
          python continuation-driver/tools/resume-v8-frozen-target-coverage.py \
            --archive "$RUNNER_TEMP/v8-primary-original.zip" --plan-only \
            | tee "$RUNNER_TEMP/frozen-continuation-plan.json"
      - name: Continue the saved trajectory and independently qualify its full census
        run: |
          python continuation-driver/tools/resume-v8-frozen-target-coverage.py \
            --archive "$RUNNER_TEMP/v8-primary-original.zip" \
            --producer "$GITHUB_WORKSPACE/tracing-js-self" --native "$GITHUB_WORKSPACE/megatoken" \
            --work-root "$RUNNER_TEMP" --out "$RUNNER_TEMP/v8-primary-continuation" \
            2>&1 | tee "$RUNNER_TEMP/frozen-continuation-live.log"
      - name: Preserve original and resumed evidence separately including hidden files
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          archive=root/'v8-primary-continuation-original-evidence.tar.gz'
          names=['v8-primary-original.zip','v8-primary-continuation','v8-support-prepared',
                 'v8-support-lifecycle','v8-support-source-ids.json','frozen-continuation-controls.log',
                 'frozen-continuation-plan.json','frozen-continuation-live.log']
          with tarfile.open(archive,'w:gz') as tar:
              for name in names:
                  path=root/name
                  if path.exists(): tar.add(path,arcname=name,recursive=True)
          with archive.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          receipt={'schema':'frozen-v8-continuation-transport/1','archive':archive.name,
                   'bytes':archive.stat().st_size,'sha256':digest,'driverRevision':os.environ['GITHUB_SHA'],
                   'producerRevision':'9cf091e6ccc5add960ef0897576d0c391b199a65',
                   'consumerRevision':'1a69d9da3254b7568c831d12866a629c206cf4fe'}
          (root/'v8-primary-continuation-transport.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-primary-continuation-original-evidence
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/v8-primary-continuation-original-evidence.tar.gz
            ${{ runner.temp }}/v8-primary-continuation-transport.json
            ${{ runner.temp }}/v8-primary-continuation/result.json
            ${{ runner.temp }}/v8-primary-continuation/preflight.json
            ${{ runner.temp }}/v8-primary-continuation/target-position-coverage.json
