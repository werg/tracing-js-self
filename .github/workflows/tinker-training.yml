name: Tinker execution training infrastructure
on:
  workflow_dispatch:
    inputs:
      fuzz_count:
        description: Bounded independent and adversarial verification cases
        type: number
        default: 10000
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'src/**'
      - 'tools/tinker-*.mjs'
      - 'test/tinker-*.test.js'
      - 'package*.json'
      - '.github/workflows/tinker-training.yml'
  pull_request:
    paths:
      - 'training/**'
      - 'src/**'
      - 'tools/tinker-*.mjs'
      - 'test/tinker-*.test.js'
      - 'package*.json'
      - '.github/workflows/tinker-training.yml'
permissions:
  contents: read
concurrency:
  group: tinker-training-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.4'
          enable-cache: true
          cache-dependency-glob: 'training/uv.lock'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JS grading and dependency-free Python tests
        run: npm run test:tinker
      - name: Install pinned CPU SDK and check real renderer
        run: uv sync --project training --locked
      - name: Python tests with actual Tinker types available
        run: uv run --project training --locked python -m unittest discover -s training/tests -v
      - name: Export complete source-family dataset without model compute
        run: uv run --project training --locked tinker-js --config training/configs/inkling-mini.json export
      - name: Offline SDK and dataset preflight
        run: uv run --project training --locked tinker-js --config training/configs/inkling-mini.json check
      - name: Freeze a study and prepare the live diagnostic without compute
        run: |
          uv run --project training --locked tinker-study plan --config training/configs/inkling-mini.json --output-dir runs/ci-study
          uv run --project training --locked tinker-study probe --config training/configs/inkling-mini.json --output-dir runs/ci-probe
      - name: Independent boundary and adversarial grader controls
        env:
          FUZZ_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_count || 64 }}
        run: node tools/tinker-benchmark.mjs fuzz --count "$FUZZ_COUNT" --jobs 2 --output-dir runs/ci-tinker-fuzz
      - name: Audit expanded teacher formats and causal conversations
        run: node tools/tinker-supervision.mjs --dataset training/fixtures/expanded/main.jsonl --sample-per-feature 1 --output runs/ci-supervision.json
      - name: Preserve local verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinker-local-verification
          path: |
            runs/ci-tinker-fuzz/report.json
            runs/ci-tinker-fuzz/failure-*.json
            runs/ci-supervision.json
            runs/tinker-followup-smoke/check.json
            runs/ci-study/plan.json
            runs/ci-study/study-report.json
            runs/ci-probe/contract-probe.json
