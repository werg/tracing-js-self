name: Prototype tests and deterministic replay
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: node bin/tracing.js demo --output "${RUNNER_TEMP}/demo.trace.json"
      - run: node bin/tracing.js replay "${RUNNER_TEMP}/demo.trace.json"
