name: Complete installed V8 source and recovery qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-v8-${{ github.ref }}
  # Manual evidence runs finish; new PR revisions supersede obsolete checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installed-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Cache the exact locked production dependency archives
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Qualify both complete populations through the installed public V8 entry
        run: |
          node tools/qualify-installed-v8.mjs --population both --workers 2 \
            --out "$RUNNER_TEMP/v8-installed" \
            2>&1 | tee "$RUNNER_TEMP/semantic-v8-installed.log"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const report=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'v8-installed','report.json')));
          if(report.status!=='completed'||report.coverageComplete!==true||report.sourcePopulationQualified!==true)
            throw new Error('Installed qualification requires every declared source/public case to pass');
          for(const [name,declared]of [['all',665],['interoperability',69]]){
            const count=report.totals[name];
            if(count?.declared!==declared||count.attempted!==declared||count.sourceQualified!==declared||
              count.sourceUnqualified!==0||count.untested!==0)
              throw new Error('Installed qualification changed or failed the complete '+name+' population');
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-v8-installed-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/semantic-v8-installed.log
            ${{ runner.temp }}/v8-installed/
