name: Namespace paired artifact and standalone asset boundaries

on:
  push:
    branches: [codex/v8-namespace-artifact-portability-20261122]

permissions:
  contents: read

concurrency:
  group: namespace-artifact-portability-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  paired-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TRACING_JS_SELF_ROOT: ${{ github.workspace }}/tracing-js-self
      MEGATOKEN_NATIVE_SOURCE_PRODUCER: ${{ github.workspace }}/tracing-js-self
      MEGATOKEN_TOKENIZER_JSON: ${{ github.workspace }}/tokenizer.json
      SEMANTIC_V8_NATIVE_POLICY: ${{ github.workspace }}/tracing-js-self/contracts/semantic-native-policy-v8.json
      MEGATOKEN_ROOT: ${{ github.workspace }}/megatoken
      MEGATOKEN_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: b6e0bf97963a135a5cb9280555cc03c77eac7b37
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: tracing-js-self/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install exact producer and native dependencies
        run: |
          npm ci --prefix tracing-js-self --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tracing-js-self/tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
          python -m pip install ruff
      - name: Acquire the exact production tokenizer
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from megatoken.generation.codec import LING_REPOSITORY, LING_REVISION, LING_TOKENIZER_SHA256
          path = Path(os.environ['MEGATOKEN_TOKENIZER_JSON'])
          shutil.copyfile(hf_hub_download(LING_REPOSITORY, 'tokenizer.json', revision=LING_REVISION), path)
          policy = json.loads(Path(os.environ['SEMANTIC_V8_NATIVE_POLICY']).read_text())
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest == LING_TOKENIZER_SHA256 == policy['tokenizerSha256']
          PY
      - name: Check the committed paired namespace contract
        working-directory: tracing-js-self
        shell: bash
        run: |
          set -o pipefail
          npm run semantic:v8:contract 2>&1 | tee "$RUNNER_TEMP/namespace-contract.log"
          cmp contracts/semantic-execution-v8.json ../megatoken/src/megatoken/data/contracts/semantic-execution-v8.json
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          assert Path('test/fixtures/semantic-regions-v8.json').read_bytes()==gzip.decompress(base64.b64decode(Path('../megatoken/tests/fixtures/semantic-regions-v8.json.gz.b64').read_text()))
          assert json.loads(Path('contracts/semantic-native-policy-v8.json').read_text())['consumerRevision']=='b6e0bf97963a135a5cb9280555cc03c77eac7b37'
          PY
      - name: Verify standalone and partial asset dispositions
        working-directory: megatoken
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          names=('TRACING_JS_SELF_ROOT','MEGATOKEN_ROOT','MEGATOKEN_TOKENIZER_JSON')
          temporary=Path(os.environ['RUNNER_TEMP'])
          for mode in ('standalone','partial'):
              env=dict(os.environ)
              for name in names:
                  env.pop(name,None)
              if mode=='partial':
                  env[names[0]]=os.environ[names[0]]
              report=temporary/f'namespace-assets-{mode}.xml'
              command=[sys.executable,'-m','pytest','-q','tests/integration/test_module_namespace_artifact_packing.py',f'--junitxml={report}']
              result=subprocess.run(command,env=env,capture_output=True,text=True,check=False,timeout=60)
              (temporary/f'namespace-assets-{mode}.log').write_text(result.stdout+result.stderr)
              cases=list(ET.parse(report).getroot().iter('testcase'))
              assert len(cases)==1, (mode,result.stdout,result.stderr)
              if mode=='standalone':
                  assert result.returncode==0 and cases[0].find('skipped') is not None
                  assert cases[0].find('failure') is None and cases[0].find('error') is None
              else:
                  assert result.returncode==1 and cases[0].find('failure') is not None
                  assert 'Partially configured namespace artifact gate' in result.stdout
              print(f'{mode} asset disposition verified; no artifact-admission credit')
          PY
      - name: Admit and pack the actual original-module namespace artifact
        working-directory: megatoken
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          path=Path('tests/integration/test_module_namespace_artifact_packing.py')
          original=path.read_text()
          formatted=subprocess.run(['python','-m','ruff','format','--stdin-filename',str(path),'-'],input=original,text=True,capture_output=True,check=True).stdout
          if formatted!=original:
              print('FORMATTED_SOURCE_JSON '+json.dumps({'path':str(path),'content':formatted}))
          PY
          python -m ruff check tests/integration/test_module_namespace_artifact_packing.py
          python -m ruff format --check tests/integration/test_module_namespace_artifact_packing.py
          git diff --exit-code --
          git -C ../tracing-js-self diff --exit-code --
          python -m pytest -q -s tests/integration/test_module_namespace_artifact_packing.py --basetemp="$RUNNER_TEMP/namespace-packing" --junitxml="$RUNNER_TEMP/namespace-artifact-packing.xml" 2>&1 | tee "$RUNNER_TEMP/namespace-artifact-packing.log"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'namespace-artifact-packing.xml').getroot().iter('testcase'))
          if len(cases)!=1 or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('The actual source/native/token/packing namespace control must run and pass')
          print('One actual source-qualified namespace artifact passed independent native preparation and all six packed target kinds; zero optimizer updates')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namespace-artifact-portability
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/semantic-v8-transport-tests.xml
            ${{ runner.temp }}/namespace-contract.log
            ${{ runner.temp }}/namespace-native.xml
            ${{ runner.temp }}/namespace-native.log
            ${{ runner.temp }}/namespace-paired.xml
            ${{ runner.temp }}/namespace-paired.log
            ${{ runner.temp }}/namespace-artifact-packing.xml
            ${{ runner.temp }}/namespace-artifact-packing.log
            ${{ runner.temp }}/namespace-packing/
            ${{ runner.temp }}/namespace-assets-*

