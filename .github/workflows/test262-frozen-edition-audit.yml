name: Full pinned Test262 edition audit
on:
  push:
    branches: [codex/v8-edition-inventory-20261122]
    paths:
      - '.github/workflows/test262-frozen-edition-audit.yml'
      - 'tools/catalog-test262.mjs'
      - 'tools/audit-test262-edition.mjs'
      - 'src/conformance/test262-*.js'
      - 'src/conformance/ecma262-html-inventory.py'
      - 'src/test262-baseline.js'
      - 'artifacts/conformance/ecma262-17.0*'
      - 'corpus/extension/snapshots/test262/**'
      - 'npm-shrinkwrap.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: producer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: d53ebc8b1931d9f1541e43d59650776e4b766248
          path: test262
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify toolchain and install locked dependencies
        working-directory: producer
        run: |
          node --version | tee toolchain.log
          npm --version | tee -a toolchain.log
          python3 --version | tee -a toolchain.log
          xz --version | head -1 | tee -a toolchain.log
          npm ci 2>&1 | tee npm-ci.log
      - name: Build catalog from the exact upstream Git tree and retained edition bytes
        working-directory: producer
        shell: bash
        run: |
          set -o pipefail
          node tools/catalog-test262.mjs \
            --suite-root test262 \
            --revision d53ebc8b1931d9f1541e43d59650776e4b766248 \
            --out test262-catalog.json 2>&1 | tee catalog.log
          xz -6 test262-catalog.json
      - name: Reconcile all original source files and execution variants
        working-directory: producer
        shell: bash
        run: |
          set -o pipefail
          node tools/audit-test262-edition.mjs \
            --catalog test262-catalog.json.xz \
            --suite-root test262 \
            --python python3 \
            --out test262-edition-audit.json.xz 2>&1 | tee audit.log
      - name: Verify exact denominator reconciliation and retained pins
        working-directory: producer
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {execFileSync} from "node:child_process";
            const readXz=path=>JSON.parse(execFileSync("xz",["-dc",path],{maxBuffer:1024*1024*1024}));
            const catalog=readXz("test262-catalog.json.xz");
            const audit=readXz("test262-edition-audit.json.xz");
            const s=audit.report.summary;
            const membership=s.editionMembership??{};
            const sum=object=>Object.values(object).reduce((a,b)=>a+b,0);
            if(catalog.suiteRevision!=="d53ebc8b1931d9f1541e43d59650776e4b766248"||
              catalog.summary.testFiles!==53616||catalog.variants.length!==102994||
              s.catalogVariants!==catalog.variants.length||s.auditedVariants!==catalog.variants.length||
              s.testFiles!==catalog.summary.testFiles||sum(s.variantModes)!==catalog.variants.length||
              sum(s.sourceFilesByEditionMembership)!==catalog.summary.testFiles||
              sum(s.expectedOutcomes.negativePhases)+s.expectedOutcomes.normal!==catalog.variants.length||
              membership.unclassified!==catalog.variants.length||s.unresolvedEditionMembership!==catalog.variants.length||
              s.releaseRequirement.required!==0||s.releaseRequirement.notRequired!==catalog.variants.length||
              audit.report.claims.editionMembershipCertified!==false||
              audit.report.claims.applicabilityCertified!==false||audit.report.claims.conformance!==false)
              throw Error("Full frozen denominator, explicit unresolved classifications, or no-claim guard failed");
            console.log(JSON.stringify({suiteRevision:catalog.suiteRevision,catalogDigest:catalog.digest,
              auditDigest:audit.digest,testFiles:s.testFiles,variants:s.auditedVariants,
              editionMembership:s.editionMembership,releaseRequirement:s.releaseRequirement,
              modes:s.variantModes,expectedOutcomes:s.expectedOutcomes,claims:audit.report.claims},null,2));
          ' | tee denominator-check.log
      - name: Hash retained audit evidence
        working-directory: producer
        run: sha256sum test262-catalog.json.xz test262-edition-audit.json.xz catalog.log audit.log denominator-check.log toolchain.log npm-ci.log > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: test262-edition-audit-d53ebc8-${{ github.sha }}
          path: |
            producer/test262-catalog.json.xz
            producer/test262-edition-audit.json.xz
            producer/catalog.log
            producer/audit.log
            producer/denominator-check.log
            producer/toolchain.log
            producer/npm-ci.log
            producer/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
