name: Pinned stateful real-program adversarial corpus
on:
  push:
    branches: [main]
    paths:
      - 'corpus/stateful/**'
      - 'src/observational.js'
      - 'tools/build-stateful-corpus.mjs'
      - 'test/stateful-corpus.test.js'
      - 'test/stateful-differential.test.js'
      - 'src/corpus/stateful-differential.mjs'
      - 'tools/verify-stateful-differential.mjs'
      - '.github/workflows/stateful-corpus.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'corpus/stateful/**'
      - 'src/observational.js'
      - 'tools/build-stateful-corpus.mjs'
      - 'tools/audit-stateful-corpus.mjs'
      - 'test/stateful-corpus.test.js'
      - 'test/stateful-differential.test.js'
      - 'src/corpus/stateful-differential.mjs'
      - 'tools/verify-stateful-differential.mjs'
      - 'test/corpus-exhaustive-audits.test.js'
      - '.github/workflows/stateful-corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stateful-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify pinned stateful command model and deterministic mismatch reducer
        run: |
          node --test test/stateful-differential.test.js
          node tools/verify-stateful-differential.mjs --count 256 --max-commands 64 --output corpus/out/queue-differential.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("corpus/out/queue-differential.json"));
            if(r.admitted!==false||r.verifiedOwned!==false||
               r.uniqueSequences<100||r.attemptedCommands<100||
               r.agreed!==r.uniqueSequences||r.disagreed!==0)
              throw Error("Stateful differential oracle disagreed or was mislabeled");
            console.log("Queue command histories",r.uniqueSequences,"commands",r.attemptedCommands);
          '
      - name: Validate all nine Axios adversarial families first
        run: |
          node tools/build-stateful-corpus.mjs --project axios \
            --per-scenario 1 --limit 9 --min-verified 9 \
            --output "$RUNNER_TEMP/axios-smoke.jsonl" \
            --report "$RUNNER_TEMP/axios-smoke-report.json" \
            --review "$RUNNER_TEMP/axios-smoke-review.md"
      - name: Run all 912 real-world stateful and interceptor scenarios
        run: |
          node tools/build-stateful-corpus.mjs --per-scenario 12 \
            --min-verified 912 \
            --output corpus/out/stateful-traces.jsonl \
            --report corpus/out/stateful-report.json \
            --review corpus/out/stateful-review.md
      - name: Summarize adversarial coverage and require 100% independent observable agreement
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("corpus/out/stateful-report.json"));
            const c=r.counts;
            if(c.scenarioFamilies!==76||c.requested!==912||c.agreed!==912||c.disagreed||c.observerErrors)
              throw Error("No useful adversarial evidence: "+JSON.stringify(c));
            console.log("Adversarial coverage",JSON.stringify(c));
            console.log("Failure reasons",JSON.stringify(r.failures.slice(0,12)));
          '
      - name: Audit every scenario, pinned module and source-site region
        run: |
          npm run corpus:stateful:audit -- \
            --input corpus/out/stateful-traces.jsonl --require-complete \
            --min-verified 912 \
            --output corpus/out/stateful-quality.json \
            --review corpus/out/stateful-quality.md
      - name: Exercise additional adversarial source interactions (28 executions)
        run: |
          node tools/build-stateful-corpus.mjs --suite adversarial \
            --per-scenario 2 --min-verified 28 \
            --output corpus/out/adversarial-traces.jsonl \
            --report corpus/out/adversarial-report.json \
            --review corpus/out/adversarial-review.md
          node tools/audit-stateful-corpus.mjs --suite adversarial \
            --input corpus/out/adversarial-traces.jsonl --min-verified 28 \
            --output corpus/out/adversarial-quality.json \
            --review corpus/out/adversarial-quality.md
      - name: Upload diagnostics including all failures
        uses: actions/upload-artifact@v4
        with:
          name: pinned-stateful-adversarial-v8-diagnostics
          path: |
            corpus/out/queue-differential.json
            corpus/out/stateful-traces.jsonl
            corpus/out/stateful-report.json
            corpus/out/stateful-review.md
            corpus/out/stateful-quality.json
            corpus/out/stateful-quality.md
            corpus/out/adversarial-traces.jsonl
            corpus/out/adversarial-report.json
            corpus/out/adversarial-review.md
            corpus/out/adversarial-quality.json
            corpus/out/adversarial-quality.md
          if-no-files-found: error
