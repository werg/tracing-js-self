name: Preserve exact V8 archives and complete original job logs

on:
  push:
    branches: [codex/v8-release-evidence-custody-20261122]
    paths:
      - .github/workflows/retain-v8-release-evidence.yml
      - tools/retain-v8-evidence-plan.py
      - tools/retain-workflow-artifact.py
      - tools/native-consumer/test_release_evidence_custody.py
      - profiles/v8-evidence-custody-2026-11-22.json
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: v8-release-evidence-custody
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Check exact source, failure, log and draft refusal controls
        run: |
          python -m unittest discover -s tools/native-consumer -p test_release_evidence_custody.py -v \
            2>&1 | tee "$RUNNER_TEMP/v8-custody-controls.log"
      - name: Retain exact original bytes and independently reread every draft asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/retain-v8-evidence-plan.py \
            --plan profiles/v8-evidence-custody-2026-11-22.json \
            --out "$RUNNER_TEMP/v8-evidence-custody" \
            2>&1 | tee "$RUNNER_TEMP/v8-custody-execution.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-complete-evidence-custody-receipts
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/v8-custody-controls.log
            ${{ runner.temp }}/v8-custody-execution.log
            ${{ runner.temp }}/v8-evidence-custody/summary.json
            ${{ runner.temp }}/v8-evidence-custody/progress.json
            ${{ runner.temp }}/v8-evidence-custody/*/metadata.json
            ${{ runner.temp }}/v8-evidence-custody/*/complete-job-*.log
            ${{ runner.temp }}/v8-evidence-custody/*/archive-driver.log
            ${{ runner.temp }}/v8-evidence-custody/*/complete-custody-*.json
            ${{ runner.temp }}/v8-evidence-custody/*/archive-custody/custody.json
