name: Paired native computation and supervision

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-native-conditioning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-input-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          # Exact paired consumer; old checkpoint and prepared formats are rejected.
          ref: c46acf851baca2c5351a6596fa61bdddee313fc8
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install immutable producer and companion prerequisites
        run: |
          npm install --global "$(node -p "require('./profiles/release-environment.lock.json').npm")" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
      - name: Verify the pinned production tokenizer and native environment
        run: |
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from megatoken.generation.codec import LING_REPOSITORY, LING_REVISION, LING_TOKENIZER_SHA256
          source = hf_hub_download(LING_REPOSITORY, 'tokenizer.json', revision=LING_REVISION)
          target = Path(os.environ['RUNNER_TEMP']) / 'tokenizer.json'
          shutil.copyfile(source, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == LING_TOKENIZER_SHA256
          PY
          python tools/native-consumer/check_environment.py --megatoken megatoken \
            --tokenizer "$RUNNER_TEMP/tokenizer.json" --out "$RUNNER_TEMP/native-environment.json"
      - name: Freshly verify one direct execution and save its original candidate
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {verifyEffectfulTrainingCase} from './src/training/effectful-admit.js';
          const result=await verifyEffectfulTrainingCase({
            source:'"use strict";function run(a,b){return a&b;}',
            entry:'run',args:[6,3],family:'paired-native-input-parity',
            taskId:'flag-intersection-pure',license:'repository-fixture',
            trustTier:'repository-fixture',fixture:{calls:[ ]}});
          if(result.status!=='locally_verified')throw new Error('Source was not independently verified: '+result.status);
          writeFileSync(join(process.env.RUNNER_TEMP,'candidate.json'),JSON.stringify(result.exported)+'\n');
          JS
      - name: Compare real data and serving adapter call arguments before neural execution
        run: |
          python tools/native_input_parity.py \
            --consumer-root megatoken \
            --episode "$RUNNER_TEMP/candidate.json" \
            --out "$RUNNER_TEMP/native-input-parity.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads((Path(os.environ['RUNNER_TEMP'])/'native-input-parity.json').read_text())
          assert row['status']=='passed'
          assert row['controlBytesMatch'] and row['observedRecordBytesMatch']
          assert row['trackPurposeMatch']
          assert row['modelSelections']==0 and row['optimizerSteps']==0
          assert not row['nativeAdmissionClaim']
          print('Repaired first-decision byte/control/track-purpose parity passed; model conditionals remain unmeasured.')
          PY
      - name: Recollect an independently admitted asynchronous training episode
        run: |
          node tools/generate-effectful-training.mjs --out "$RUNNER_TEMP/native-corpus" --limit 1 --jobs 1 \
            --megatoken megatoken --python python --tokenizer "$RUNNER_TEMP/tokenizer.json" \
            --native-policy contracts/native-admission-policy-v6.json --require-native
      - name: Compare actual checkpoint conditionals and audit every native target
        run: |
          python tools/probe-native-conditionals.py --consumer-root megatoken \
            --episode "$RUNNER_TEMP/native-corpus/counter-0.json" \
            --initialize-tiny --tokenizer-json "$RUNNER_TEMP/tokenizer.json" \
            --execute-decoder --audit-supervision --output "$RUNNER_TEMP/native-conditionals"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'native-conditionals'
          report = json.loads((root / 'report.json').read_text())
          audit = json.loads((root / 'training-supervision-audit.json').read_text())
          assert report['gaussianConditionalStatus'] == 'passed'
          assert report['recurrentStateComparison']['status'] == 'passed'
          assert report['decoderSupportComparison']['status'] == 'passed'
          assert audit['status'] == 'passed'
          assert audit['allGeneratedTokensScored'] and audit['allObservedTokensUnscored']
          assert audit['futureObservationCanary']['status'] == 'passed'
          print(json.dumps({'checkpoint': report['identity'], 'supervision': audit['status'],
                            'futureObservationCanary': audit['futureObservationCanary']}))
          PY
      - name: Preserve original candidate and both actual adapter inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-native-input-parity
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/native-input-parity.json
            ${{ runner.temp }}/native-environment.json
            ${{ runner.temp }}/native-corpus/
            ${{ runner.temp }}/native-conditionals/
