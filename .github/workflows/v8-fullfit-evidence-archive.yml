name: Preserve unchanged diagnostic V8 fit as an unpublished evidence draft

on:
  push:
    branches: [codex/v8-fullfit-evidence-archive-20261122]

permissions:
  contents: write
  actions: read

concurrency:
  group: v8-fullfit-evidence-archive-45025994295
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original artifact and preserve only an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/archive-v8-fullfit-evidence.py --publish-draft --work "${{ runner.temp }}/v8-evidence-archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v8-fullfit-draft-archive-receipt
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/v8-evidence-archive/archive-receipt.json
            ${{ runner.temp }}/v8-evidence-archive/SHA256SUMS
