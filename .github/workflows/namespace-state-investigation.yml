name: Experimental namespace state and native differentials

on:
  push:
    branches: [codex/v8-namespace-state-validation-20261122]

permissions:
  contents: read

concurrency:
  group: namespace-state-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MEGATOKEN_ROOT: ${{ github.workspace }}/megatoken
      MEGATOKEN_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: werg/megatoken
          ref: 3ca04ef05f05b89d05464f1b0534045efb6106a4
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: tracing-js-self/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install exact producer and native dependencies
        run: |
          npm ci --prefix tracing-js-self --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tracing-js-self/tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
          python -m pip install ruff
      - name: Format and retain the experimental native candidate
        working-directory: megatoken
        run: |
          python -m ruff check --fix src/megatoken/data/module_namespace_state_v8.py src/megatoken/data/module_namespace_machine_v8.py tests/test_module_namespace_state_v8.py tests/test_module_namespace_machine_v8.py
          python -m ruff format src/megatoken/data/module_namespace_state_v8.py src/megatoken/data/module_namespace_machine_v8.py tests/test_module_namespace_state_v8.py tests/test_module_namespace_machine_v8.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ('src/megatoken/data/module_namespace_state_v8.py','src/megatoken/data/module_namespace_machine_v8.py','tests/test_module_namespace_state_v8.py','tests/test_module_namespace_machine_v8.py'):
              print('FORMATTED_SOURCE_JSON '+json.dumps({'path':path,'content':Path(path).read_text()}))
          PY
      - name: Check independent native state transitions
        working-directory: megatoken
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check src/megatoken/data/module_namespace_state_v8.py src/megatoken/data/module_namespace_machine_v8.py tests/test_module_namespace_state_v8.py tests/test_module_namespace_machine_v8.py
          python -m ruff format --check src/megatoken/data/module_namespace_state_v8.py src/megatoken/data/module_namespace_machine_v8.py tests/test_module_namespace_state_v8.py tests/test_module_namespace_machine_v8.py
          python -m pytest -q tests/test_module_namespace_state_v8.py tests/test_module_namespace_machine_v8.py --junitxml="$RUNNER_TEMP/namespace-native.xml" 2>&1 | tee "$RUNNER_TEMP/namespace-native.log"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'namespace-native.xml').getroot().iter('testcase'))
          if not cases or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every experimental native state control must run and pass')
          print(f'{len(cases)} experimental native state controls passed with zero skips')
          PY
      - name: Compare source-derived state, native ESM and owned module behavior
        if: ${{ !cancelled() }}
        working-directory: tracing-js-self
        shell: bash
        run: |
          set -o pipefail
          node --check src/semantic/module-namespace-state-v8.js
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/namespace-paired.xml" test/semantic-module-v8.test.js test/semantic-module-namespace-state-v8.test.js test/semantic-module-namespace-machine-v8.test.js test/semantic-module-namespace-source*.test.js test/semantic-native-module-namespace-state-v8.test.js test/semantic-module-namespace-runtime-capture-v8.test.js 2>&1 | tee "$RUNNER_TEMP/namespace-paired.log"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'namespace-paired.xml').getroot().iter('testcase'))
          if not cases or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every experimental namespace differential must run and pass')
          print(f'{len(cases)} namespace differentials and refusal controls passed with zero skips')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namespace-state-experiment
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/namespace-native.xml
            ${{ runner.temp }}/namespace-native.log
            ${{ runner.temp }}/namespace-paired.xml
            ${{ runner.temp }}/namespace-paired.log
