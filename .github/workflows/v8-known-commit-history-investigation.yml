name: Known native commit, child startup and complete host-history recovery

on:
  push:
    branches: [codex/v8-combined-recovery-ledger-20261122, codex/v8-bootstrap-recovery-20261122]

permissions:
  contents: read

concurrency:
  group: known-commit-history-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  paired-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MEGATOKEN_ROOT: ${{ github.workspace }}/megatoken
      MEGATOKEN_PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/megatoken/src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      REQUIRE_KNOWN_COMMIT_RECOVERY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: werg/megatoken
          ref: 8cdec19dbac9af0ba7968ac3b1adb84e53ce0dbc
          path: megatoken
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: tracing-js-self/.nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install exact paired runtime and require kernel clock authority
        run: |
          test -L /proc/self/ns/time
          npm ci --prefix tracing-js-self --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r tracing-js-self/tools/native-consumer/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./megatoken
          test "$(git -C megatoken rev-parse HEAD)" = 8cdec19dbac9af0ba7968ac3b1adb84e53ce0dbc
          cmp tracing-js-self/contracts/semantic-execution-v8.json megatoken/src/megatoken/data/contracts/semantic-execution-v8.json
      - name: Verify complete reconstruction, real native recovery and refusal boundaries
        working-directory: tracing-js-self
        run: |
          node --test --test-concurrency=1 --test-reporter=junit \
            test/selected-orchestration-clock.test.js \
            test/semantic-known-commit-builder-v8.test.js \
            test/semantic-known-commit-history-v8.test.js \
            test/semantic-native-durable-commit-v8.test.js \
            test/semantic-native-orchestration-recovery-v8.test.js \
            test/semantic-selected-orchestration-checkpoint-v8.test.js \
            test/semantic-selected-history-tail-v8.test.js \
            2>&1 | tee "$RUNNER_TEMP/known-commit-history.xml"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse(Path(os.environ['RUNNER_TEMP'])/'known-commit-history.xml').getroot().iter('testcase'))
          if len(cases)!=72 or any(case.find(kind) is not None for case in cases for kind in ('failure','error','skipped')):
              raise ValueError('Every one of the 72 exact create/bootstrap/join/progress/clock/history controls must run and pass')
          print('72 complete-history controls passed; zero skips; known create/bootstrap outcomes and repeated process loss included')
          PY
      - name: Preserve exact candidate checkouts
        if: ${{ !cancelled() }}
        run: |
          test -z "$(git -C tracing-js-self status --porcelain)"
          test -z "$(git -C megatoken status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: known-commit-history-controls
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/known-commit-history.xml
