[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracing-js-tinker"
version = "0.1.0"
description = "Inkling execution training and compression experiments for tracing-js-self"
requires-python = ">=3.11,<3.15"
dependencies = [
  "tinker==0.40.0",
  "tinker-cookbook==0.7.1",
  "tml-renderers==0.4.2",
  "torch==2.15.0",
]

[project.scripts]
tinker-js = "tinker_js.runner:main"
tinker-study = "tinker_js.experiments:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinker_js*", "tinker_py*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
